<script>
(function(){
  var shot=document.querySelector('[data-galerij]');
  if(!shot)return;
  var groot=[].slice.call(shot.querySelectorAll('.vh-groot'));
  var mini=[].slice.call(document.querySelectorAll('.vh-m'));
  if(groot.length<2)return;
  shot.classList.add('js-galerij');
  function toon(i){
    groot.forEach(function(el,n){el.classList.toggle('is-aan',n===i)});
    mini.forEach(function(el,n){el.classList.toggle('is-aan',n===i)});
  }
  mini.forEach(function(el,i){el.addEventListener('click',function(){toon(i)})});
  document.addEventListener('keydown',function(e){
    var aan=groot.findIndex(function(el){return el.classList.contains('is-aan')});
    if(e.key==='ArrowRight')toon((aan+1)%groot.length);
    if(e.key==='ArrowLeft')toon((aan-1+groot.length)%groot.length);
  });
})();
</script>
